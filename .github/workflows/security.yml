name: Security SAST Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  sast:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Audit NPM Dependencies
        run: npm audit --audit-level=high
